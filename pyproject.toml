[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "local-akuvox"
dynamic = ["version"]
description = "Home Assistant custom integration for Akuvox intercom devices"
requires-python = ">=3.13.2"
dependencies = [
    "homeassistant>=2026.2.0",
    "pylocal-akuvox>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-homeassistant-custom-component>=0.13.316",
]

[dependency-groups]
dev = [
    "interrogate>=1.7.0",
    "mypy>=2.1.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-homeassistant-custom-component>=0.13.316",
    "ruff>=0.15.20",
]

# Mirror Home Assistant's constrained aiohttp versions so uv can still
# lock and test against pylocal-akuvox 1.0.0.
[tool.uv]
override-dependencies = [
    "aiohttp==3.13.3; python_full_version < '3.14.2'",
    "aiohttp==3.13.5; python_full_version >= '3.14.2'",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C90",  # mccabe complexity
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
]
ignore = [
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D103"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "pylocal_akuvox",
    "pylocal_akuvox.*",
    "homeassistant.*",
    "pytest_homeassistant_custom_component.*",
]
ignore_missing_imports = true

# Some Home Assistant and pylocal-akuvox dynamic attributes are provided
# at runtime or by test doubles. Suppress unused-ignore warnings for files
# that use narrow type ignores around those compatibility seams.
[[tool.mypy.overrides]]
module = [
    "tests.conftest",
    "custom_components.local_akuvox.coordinator",
    "custom_components.local_akuvox.config_flow",
    "custom_components.local_akuvox.options_flow",
    "custom_components.local_akuvox",
]
warn_unused_ignores = false

[tool.interrogate]
ignore-init-method = false
ignore-init-module = true
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = true
ignore-setters = false
fail-under = 100
verbose = 2

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = false
source = ["custom_components.local_akuvox"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["custom_components"]
