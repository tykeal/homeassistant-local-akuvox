blank_issues_enabled: false
contact_links:
  - name: "My Akuvox device isn't supported (add device support)"
    url: "https://github.com/tykeal/pylocal-akuvox/issues/new?template=new_device.yml"
    about: >-
      Report unsupported or not-yet-supported devices upstream in
      pylocal-akuvox, where the capability matrix lives. You can attach this
      integration's diagnostics download as capability evidence.
