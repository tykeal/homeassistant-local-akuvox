name: 'CodeQL'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: ['main']
  schedule:
    - cron: '26 16 * * 2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  scan:
    name: 'Audit Repository'
    # Migrated from lfit/releng-reusable-workflows, which is retiring,
    # to the security lane in lfreleng-actions/security-workflows.
    # The input was renamed from 'codeql_config' to 'config_file';
    # languages defaults to Python and keeps the previous behavior.
    #
    # The lane names its jobs 'Analyze (python)' and
    # 'Validate Workflow Inputs'. Neither name is a required status
    # check in this repository.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/codeql.yaml@b9d7b83b5696ab8388bcc11c3fe931563861e258  # v0.10.0
    with:
      config_file: .github/codeql/codeql-config.yml
    permissions:
      security-events: write  # Upload CodeQL results to code scanning.
      # required to fetch internal or private CodeQL packs
      packages: read  # Fetch internal or private CodeQL packs.
      # only required for workflows in private repositories
      actions: read  # Read workflow metadata (private repos only).
      contents: read  # Check out the repository to analyze.
