---
ignore:
  # aiohttp transitive dependency via homeassistant.
  - vulnerability: GHSA-hg6j-4rv6-33pg
    package:
      name: aiohttp
      type: python
  - vulnerability: GHSA-jg22-mg44-37j8
    package:
      name: aiohttp
      type: python

  # pillow transitive dependency via homeassistant — PSD
  # out-of-bounds write (CVE-2026-25990), fixed in 12.1.1.
  # We cannot pin pillow directly because it comes from
  # homeassistant.
  - vulnerability: GHSA-cfh3-3jmp-rvhc
    package:
      name: pillow
      type: python

  # PyJWT transitive dependency via homeassistant —
  # algorithm confusion (GHSA-752w-5fwx-jx9f), fixed
  # in 2.12.0. Pinned by homeassistant upper bound.
  - vulnerability: GHSA-752w-5fwx-jx9f
    package:
      name: PyJWT
      type: python

  # pip is CI runner tooling, not a project dependency.
  # GHSA-58qw-9mgm-455v has no fixed version yet.
  - vulnerability: GHSA-58qw-9mgm-455v
    package:
      name: pip
      type: python
  # pip 26.0.1 — GHSA-jp4c-xjxw-mgf9, fixed in 26.1.
  # pip is CI runner tooling, not shipped.
  - vulnerability: GHSA-jp4c-xjxw-mgf9
    package:
      name: pip
      type: python

  # pytest pinned by pytest-homeassistant-custom-component
  # upper bound. Fixed in 9.0.3 (GHSA-6w46-j5rx-g56g).
  - vulnerability: GHSA-6w46-j5rx-g56g
    package:
      name: pytest
      type: python

  # uv is dev tooling, not a project dependency.
  - vulnerability: GHSA-4gg8-gxpx-9rph
    package:
      name: uv
      type: python

  # urllib3 transitive dependency via homeassistant —
  # pinned by homeassistant upper bound.
  - vulnerability: GHSA-mf9v-mfxr-j63j
    package:
      name: urllib3
      type: python
  - vulnerability: GHSA-qccp-gfcp-xxvc
    package:
      name: urllib3
      type: python

  # idna transitive dependency via homeassistant/requests.
  # Fixed in 3.15, but pinned indirectly by upstream deps.
  - vulnerability: GHSA-65pc-fj4g-8rjx
    package:
      name: idna
      type: python

  # zeroconf transitive dependency via homeassistant.
  - vulnerability: GHSA-9pgc-3ccv-5297
    package:
      name: zeroconf
      type: python
  - vulnerability: GHSA-phvx-9mgw-67r5
    package:
      name: zeroconf
      type: python
  - vulnerability: GHSA-rfg2-pjw2-56x2
    package:
      name: zeroconf
      type: python
